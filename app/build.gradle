plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.maya.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.maya.ai"
        minSdk 26          // Android 8.0+ — vector icon + modern APIs
        targetSdk 34
        versionCode 80
        versionName "5.15.0"
    }

    signingConfigs {
        maya {
            storeFile file("maya.keystore")
            storePassword "maya2026adil"
            keyAlias "maya"
            keyPassword "maya2026adil"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.maya
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.maya
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
