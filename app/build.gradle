plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

/* ═══════════════════════════════════════════════════════════════════
   SIGNING — credentials CODE mein nahi hain (docs/SECURITY.md)

   Tartib:
     1. keystore.properties  (local, gitignored)
     2. CI env vars          (GitHub Secrets — build workflows set karte hain)
     3. Fallback: default debug signing — build KABHI fail nahi hota
   ═══════════════════════════════════════════════════════════════════ */
def signingProps = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) {
    signingFile.withInputStream { signingProps.load(it) }
}
def ksFile   = signingProps.getProperty('storeFile')     ?: System.getenv('MAYA_KEYSTORE_FILE')
def ksPass   = signingProps.getProperty('storePassword') ?: System.getenv('MAYA_KEYSTORE_PASSWORD')
def ksAlias  = signingProps.getProperty('keyAlias')      ?: System.getenv('MAYA_KEY_ALIAS')
def ksKeyPass = signingProps.getProperty('keyPassword')  ?: System.getenv('MAYA_KEY_PASSWORD')
def ksFileResolved = ksFile ? rootProject.file(ksFile) : null
def hasMayaSigning = ksFileResolved != null && ksFileResolved.exists() &&
        ksPass != null && ksAlias != null && ksKeyPass != null

android {
    namespace 'com.maya.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.maya.ai"
        minSdk 26          // Android 8.0+ — vector icon + modern APIs
        targetSdk 34
        versionCode 79
        versionName "5.12.0"
    }

    signingConfigs {
        maya {
            if (hasMayaSigning) {
                storeFile ksFileResolved
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
        /* v5.12.0 — jab secrets NA hon: debug key EK hi jagah se (CI cache +
           docs/signing-cert-sha256.txt pin). AGP ko khud apna random key
           banane ka moqa nahi — warna har build ka signature alag hota tha
           aur user ki settings udd jati thin. File missing/kharaab = build
           LOUD fail (chup-chaap dusri key nahi). */
        stableDebug {
            storeFile new File(System.getProperty('user.home'), '.android/debug.keystore')
            storePassword System.getenv('MAYA_DEBUG_STOREPASS') ?: 'android'
            keyAlias 'androiddebugkey'
            keyPassword System.getenv('MAYA_DEBUG_KEYPASS') ?: 'android'
        }
    }

    buildTypes {
        debug {
            if (hasMayaSigning) signingConfig signingConfigs.maya
            else signingConfig signingConfigs.stableDebug
        }
        release {
            minifyEnabled false
            if (hasMayaSigning) signingConfig signingConfigs.maya
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

if (!hasMayaSigning) {
    logger.lifecycle('⚠️ MAYA keystore nahi mila (keystore.properties / CI secrets) — default debug signing se build hoga. Hal: docs/SECURITY.md')
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
