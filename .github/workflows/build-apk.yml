name: Build MAYA APK

# Har push par: PEHLE test, phir APK, phir "latest" RELEASE mein seedha download link
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Code checkout
        uses: actions/checkout@v4

      - name: 2. Node setup
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Deps install
        run: npm install --no-audit --no-fund

      - name: 4. TESTS (1000+ — ek bhi fail = build band)
        run: npm test

      - name: 5. BUILD SYNC CHECK (web/ se index.html fresh?)
        run: node build.js --check

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 1. Code checkout
        uses: actions/checkout@v4

      - name: 2. Java 17 setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3. Gradle 8.7 setup
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 4. Signing keystore (Secrets se — docs/SECURITY.md)
        env:
          MAYA_KEYSTORE_BASE64: ${{ secrets.MAYA_KEYSTORE_BASE64 }}
          MAYA_KEYSTORE_PASSWORD: ${{ secrets.MAYA_KEYSTORE_PASSWORD }}
          MAYA_KEY_ALIAS: ${{ secrets.MAYA_KEY_ALIAS }}
          MAYA_KEY_PASSWORD: ${{ secrets.MAYA_KEY_PASSWORD }}
        run: |
          if [ -n "$MAYA_KEYSTORE_BASE64" ]; then
            echo "$MAYA_KEYSTORE_BASE64" | base64 -d > app/maya.keystore
            echo "MAYA_KEYSTORE_FILE=app/maya.keystore" >> $GITHUB_ENV
            echo "MAYA_KEYSTORE_PASSWORD=$MAYA_KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "MAYA_KEY_ALIAS=$MAYA_KEY_ALIAS" >> $GITHUB_ENV
            echo "MAYA_KEY_PASSWORD=$MAYA_KEY_PASSWORD" >> $GITHUB_ENV
            echo "✅ Keystore ready (may signing)"
          else
            echo "⚠️ MAYA_KEYSTORE_BASE64 secret nahi — debug signing se build hoga (docs/SECURITY.md)"
          fi

      - name: 5. APK BUILD (3-6 minute)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 6. APK upload (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: MAYA-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 7. 🌐 LATEST RELEASE — hamesha taaza download link
        # Hamesha ek hi URL: /releases/download/latest/MAYA-latest.apk
        # Har push par asset replace — phone se seedha download & install
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MAYA-latest.apk
          NOTES="Auto-build ${GITHUB_SHA::7} · $(date -u +'%Y-%m-%d %H:%M UTC') · Tests green · Download: MAYA-latest.apk"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest MAYA-latest.apk --clobber
            gh release edit latest --notes "$NOTES"
            echo "✅ 'latest' release asset replace — /releases/download/latest/MAYA-latest.apk"
          else
            gh release create latest MAYA-latest.apk \
              --prerelease \
              --title "MAYA — Latest Build (auto)" \
              --notes "$NOTES"
            echo "✅ 'latest' release bana — /releases/download/latest/MAYA-latest.apk"
          fi
