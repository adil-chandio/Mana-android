plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseVersion = new groovy.json.JsonSlurper().parse(rootProject.file('release/version.json'))
def updateKey = System.getenv('MAYA_UPDATE_PUBLIC_KEY_B64') ?: ''
if (!(updateKey ==~ /[A-Za-z0-9+\/=]*/)) throw new GradleException('Invalid update public key encoding')
def releaseStore = System.getenv('MAYA_APK_KEYSTORE')

android {
    namespace 'com.maya.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.maya.ai"
        minSdk (releaseVersion.minSdk as int)          // Android 8.0+ — vector icon + modern APIs
        targetSdk 34
        versionCode (releaseVersion.versionCode as int)
        versionName releaseVersion.versionName
        buildConfigField 'String', 'UPDATE_PUBLIC_KEY_B64', '"' + updateKey + '"'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        // Release material must come from a protected environment, never from Git.
        secureRelease {
            if (releaseStore) storeFile file(releaseStore)
            storePassword System.getenv('MAYA_APK_STORE_PASSWORD') ?: ''
            keyAlias System.getenv('MAYA_APK_KEY_ALIAS') ?: ''
            keyPassword System.getenv('MAYA_APK_KEY_PASSWORD') ?: ''
        }
        // Legacy compatibility for DEVELOPMENT builds only. This key is public.
        // Do not treat it as a secret or use debug artifacts as updater releases.
        maya {
            storeFile file("maya.keystore")
            storePassword "maya2026adil"
            keyAlias "maya"
            keyPassword "maya2026adil"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.maya
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.secureRelease
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

// Ordinary debug builds remain available. Publishing cannot silently fall back to
// the checked-in key or to metadata with no pinned verification key.
tasks.configureEach { task ->
    // Keep development APKs behind native policy tests, including the existing CI.
    if (task.name == 'assembleDebug') task.dependsOn('testDebugUnitTest')
    if (task.name == 'preReleaseBuild') {
        task.doFirst {
            if (!releaseStore || !file(releaseStore).isFile() || !updateKey) {
                throw new GradleException('Release requires signing secrets and MAYA_UPDATE_PUBLIC_KEY_B64; see docs/UPDATE-CENTER.md')
            }
            ['MAYA_APK_STORE_PASSWORD', 'MAYA_APK_KEY_ALIAS', 'MAYA_APK_KEY_PASSWORD'].each {
                if (!System.getenv(it)) throw new GradleException('Missing release signing configuration: ' + it)
            }
        }
    }
}

// Make native-test evidence visible even in the unchanged legacy CI workflow.
tasks.withType(Test).configureEach {
    afterSuite { descriptor, result ->
        if (!descriptor.parent) {
            def summary = "${result.testCount} tests: ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped"
            logger.lifecycle("Native JVM test result: " + summary)
            if (System.getenv('GITHUB_ACTIONS') == 'true') {
                logger.lifecycle("::notice title=Native JVM tests::" + summary)
            }
        }
    }
}

// Verify the actual development binary before the existing CI uploads it.
// This does not activate release publishing or enroll an update trust key.
tasks.configureEach { task ->
    if (task.name == 'assembleDebug') task.doLast {
        def apk = layout.buildDirectory.file('outputs/apk/debug/app-debug.apk').get().asFile
        def tools = new File(android.sdkDirectory, "build-tools/${android.buildToolsVersion}")
        def windows = System.getProperty('os.name').toLowerCase().contains('windows')
        def inspect = { name, suffix, args ->
            def output = new ByteArrayOutputStream()
            project.exec {
                commandLine([new File(tools, name + (windows ? suffix : '')).absolutePath] + args)
                standardOutput = output
            }
            return output.toString('UTF-8')
        }
        def badging = inspect('aapt', '.exe', ['dump', 'badging', apk.absolutePath])
        def identity = "package: name='com.maya.ai' versionCode='${releaseVersion.versionCode}' versionName='${releaseVersion.versionName}'"
        if (!badging.contains(identity) || !badging.contains("sdkVersion:'${releaseVersion.minSdk}'") || !badging.contains('application-debuggable')) {
            throw new GradleException('Development APK identity does not match release/version.json')
        }
        def signature = inspect('apksigner', '.bat', ['verify', '--verbose', '--print-certs', apk.absolutePath])
        def signer = signature =~ /(?m)^Signer #1 certificate SHA-256 digest: ([a-fA-F0-9]{64})$/
        if (!signer.find()) throw new GradleException('No verified APK signing certificate')
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        apk.withInputStream { input ->
            byte[] buffer = new byte[32768]
            int n
            while ((n = input.read(buffer)) != -1) digest.update(buffer, 0, n)
        }
        def summary = "DEVELOPMENT ONLY; ${releaseVersion.versionName} (${releaseVersion.versionCode}); APK SHA-256=${digest.digest().encodeHex()}; signer SHA-256=${signer.group(1).toLowerCase()}; update trust configured=${!updateKey.isEmpty()}"
        logger.lifecycle(summary)
        if (System.getenv('GITHUB_ACTIONS') == 'true') {
            logger.lifecycle('::notice title=Verified development APK::' + summary)
        }
    }
}
