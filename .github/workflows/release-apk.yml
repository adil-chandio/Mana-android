# Release workflow — tag input se GitHub Release banata hai + APK attach karta hai
# (pehli dafa manually banana para tha — bot token workflow push nahi kar sakta)
name: Release MAYA APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (jaise v5.9.5)'
        required: true
        default: 'v5.9.5'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Code checkout
        uses: actions/checkout@v4

      - name: 2. TESTS — release se pehle lazmi
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm test

      - name: 3. Java 17 setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 4. Gradle 8.7 setup
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 4.5 STABLE DEBUG KEYSTORE (update-safe signature)
        # build-apk.yml ke sath match — dono workflows EK hi cached debug
        # keystore share karte hain → signature kabhi nahi badalta (settings safe).
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: maya-debug-keystore-v2

      - name: 4.6 DEBUG KEYSTORE ensure (cache khali/kharaab ho to khud banao)
        run: |
          mkdir -p "$HOME/.android"
          KS="$HOME/.android/debug.keystore"
          VALID=0
          if [ -f "$KS" ] && keytool -list -keystore "$KS" -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            VALID=1
          fi
          if [ "$VALID" = "1" ]; then
            echo "::notice::Debug keystore cache se mila + VALID — signature stable."
          else
            if [ -f "$KS" ]; then
              echo "::warning::Cache se keystore mila MAGAR KHARAAB tha — regenerate kar raha hoon."
              rm -f "$KS"
            else
              echo "::notice::Cache khali thi — naya debug keystore bana raha hoon."
            fi
            keytool -genkeypair -v -keystore "$KS" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug, O=Android, C=US" >/dev/null 2>&1
            echo "::notice::Naya debug keystore tayyar — is run ka signature gate batayega."
          fi

      - name: 5. Signing keystore (Secrets se — docs/SECURITY.md)
        env:
          MAYA_KEYSTORE_BASE64: ${{ secrets.MAYA_KEYSTORE_BASE64 }}
          MAYA_KEYSTORE_PASSWORD: ${{ secrets.MAYA_KEYSTORE_PASSWORD }}
          MAYA_KEY_ALIAS: ${{ secrets.MAYA_KEY_ALIAS }}
          MAYA_KEY_PASSWORD: ${{ secrets.MAYA_KEY_PASSWORD }}
        run: |
          if [ -n "$MAYA_KEYSTORE_BASE64" ]; then
            echo "$MAYA_KEYSTORE_BASE64" | base64 -d > app/maya.keystore
            echo "MAYA_KEYSTORE_FILE=app/maya.keystore" >> $GITHUB_ENV
            echo "MAYA_KEYSTORE_PASSWORD=$MAYA_KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "MAYA_KEY_ALIAS=$MAYA_KEY_ALIAS" >> $GITHUB_ENV
            echo "MAYA_KEY_PASSWORD=$MAYA_KEY_PASSWORD" >> $GITHUB_ENV
            echo "✅ Keystore ready (may signing)"
          else
            echo "⚠️ MAYA_KEYSTORE_BASE64 secret nahi — debug signing se release hogi"
          fi

      - name: 6. APK BUILD
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 6.5 SIGNATURE LOCK (kabhi khamoshi se na badle)
        # GROUND TRUTH: APK ke ASLI signing certificate se fingerprint (apksigner).
        # build-apk.yml ke sath match — pin se alag key kabhi release nahi.
        run: |
          PIN="docs/signing-cert-sha256.txt"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          FP=""
          APS=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -f "$APK" ] && [ -n "$APS" ]; then
            FP=$("$APS" verify --print-certs "$APK" 2>/dev/null | grep -m1 'SHA-256 digest' | sed 's/.*: //' | tr -d ' :' | tr 'A-F' 'a-f')
          fi
          if [ -z "$FP" ] && [ -f "$APK" ]; then
            FP=$(keytool -printcert -jarfile "$APK" 2>&1 | grep -oE 'SHA-?256:.*' | head -1 | sed -E 's/SHA-?256://;s/ //g' | tr -d ':' | tr 'A-F' 'a-f')
          fi
          echo "::notice::SIGNATURE-DIAG apk_size=$(wc -c < "$APK" 2>/dev/null || echo 0) fp=${FP:-NONE} aps=$(basename ${APS:-none}) android_dir=$(ls $HOME/.android 2>&1 | tr '\n' '|' | cut -c1-120)"
          if [ -s "$PIN" ]; then
            PIN_FP=$(tr -d ' \n\r:' < "$PIN" | tr 'A-F' 'a-f')
            if [ -z "$FP" ] || [ "$FP" != "$PIN_FP" ]; then
              echo "::error::SIGNATURE BADAL GAYA! pinned=$PIN_FP mojooda=${FP:-none} — release NAHI banega (user ki settings udd jati hain). Jaan-boojh kar badalna ho to docs/signing-cert-sha256.txt update karo."
              exit 1
            fi
            echo "✅ Signature LOCKED — pinned ke sath match"
          else
            if echo "$FP" | grep -qE '^[0-9a-f]{64}$'; then
              echo "$FP" > "$PIN"
              git config user.name "maya-ci"
              git config user.email "maya-ci@users.noreply.github.com"
              git add "$PIN"
              git commit -m "chore: signature pin bootstrap ${FP:0:12} [skip ci]"
              git push origin "HEAD:${GITHUB_REF_NAME}"
              echo "::notice::BOOTSTRAP — pin khud commit ho gaya: $FP"
            else
              echo "::error::Fingerprint hi nahi mila (fp=${FP:-empty})"
              exit 1
            fi
          fi

      - name: 6.6 AAB BUILD (Play Store) + same-signature check
        # v5.13.0 (WAQT 4-B): tagged release ke sath AAB bhi — Play Console upload.
        run: |
          gradle bundleRelease --no-daemon --stacktrace
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          PIN="docs/signing-cert-sha256.txt"
          AFP=$(keytool -printcert -jarfile "$AAB" 2>&1 | grep -oE 'SHA-?256:.*' | head -1 | sed -E 's/SHA-?256://;s/ //g' | tr -d ':' | tr 'A-F' 'a-f')
          if [ -z "$AFP" ]; then
            RSA=$(unzip -Z1 "$AAB" | grep -E '^META-INF/.*\.(RSA|DSA|EC)$' | head -1)
            unzip -p "$AAB" "$RSA" > /tmp/aab.rsa
            AFP=$(keytool -printcert -file /tmp/aab.rsa 2>&1 | grep -oE 'SHA-?256:.*' | head -1 | sed -E 's/SHA-?256://;s/ //g' | tr -d ':' | tr 'A-F' 'a-f')
          fi
          echo "::notice::AAB-DIAG aab_size=$(wc -c < "$AAB" 2>/dev/null || echo 0) fp=${AFP:-NONE}"
          PIN_FP=$(tr -d ' \n\r:' < "$PIN" | tr 'A-F' 'a-f')
          if [ -z "$AFP" ] || [ "$AFP" != "$PIN_FP" ]; then
            echo "::error::AAB ka signature APK/pin se alag hai (${AFP:-none} vs $PIN_FP) — Play upload key mismatch!"
            exit 1
          fi
          echo "✅ AAB signed with PIN key — Play upload ke liye ready"

      - name: 7. Release banayo + APK + AAB upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "MAYA-$TAG.apk"
          cp app/build/outputs/bundle/release/*.aab "MAYA-$TAG.aab"
          gh release create "$TAG" "MAYA-$TAG.apk" "MAYA-$TAG.aab" \
            --title "MAYA $TAG" \
            --notes "Auto-release — npm test green hone ke baad bani APK + AAB. Phone: APK kholo → Install anyway. Play Console: AAB upload karo."
          echo "✅ Release $TAG live (APK + AAB)"
