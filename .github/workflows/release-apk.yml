# Release workflow — tag input se GitHub Release banata hai + APK attach karta hai
# (pehli dafa manually banana para tha — bot token workflow push nahi kar sakta)
name: Release MAYA APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (jaise v5.9.5)'
        required: true
        default: 'v5.9.5'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Code checkout
        uses: actions/checkout@v4

      - name: 2. TESTS — release se pehle lazmi
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm test

      - name: 3. Java 17 setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 4. Gradle 8.7 setup
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 4.5 STABLE DEBUG KEYSTORE (update-safe signature)
        # build-apk.yml ke sath match — dono workflows EK hi cached debug
        # keystore share karte hain → signature kabhi nahi badalta (settings safe).
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: maya-debug-keystore-v1

      - name: 5. Signing keystore (Secrets se — docs/SECURITY.md)
        env:
          MAYA_KEYSTORE_BASE64: ${{ secrets.MAYA_KEYSTORE_BASE64 }}
          MAYA_KEYSTORE_PASSWORD: ${{ secrets.MAYA_KEYSTORE_PASSWORD }}
          MAYA_KEY_ALIAS: ${{ secrets.MAYA_KEY_ALIAS }}
          MAYA_KEY_PASSWORD: ${{ secrets.MAYA_KEY_PASSWORD }}
        run: |
          if [ -n "$MAYA_KEYSTORE_BASE64" ]; then
            echo "$MAYA_KEYSTORE_BASE64" | base64 -d > app/maya.keystore
            echo "MAYA_KEYSTORE_FILE=app/maya.keystore" >> $GITHUB_ENV
            echo "MAYA_KEYSTORE_PASSWORD=$MAYA_KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "MAYA_KEY_ALIAS=$MAYA_KEY_ALIAS" >> $GITHUB_ENV
            echo "MAYA_KEY_PASSWORD=$MAYA_KEY_PASSWORD" >> $GITHUB_ENV
            echo "✅ Keystore ready (may signing)"
          else
            echo "⚠️ MAYA_KEYSTORE_BASE64 secret nahi — debug signing se release hogi"
          fi

      - name: 6. APK BUILD
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 6.5 SIGNATURE LOCK (kabhi khamoshi se na badle)
        # build-apk.yml ke sath match — signature pin se alag key kabhi release nahi.
        run: |
          PIN="docs/signing-cert-sha256.txt"
          FP=""
          WHICH="none"
          if [ -n "$MAYA_KEYSTORE_FILE" ] && [ -f "$MAYA_KEYSTORE_FILE" ]; then
            FP=$(keytool -list -v -keystore "$MAYA_KEYSTORE_FILE" -storepass "${MAYA_KEYSTORE_PASSWORD}" -alias "${MAYA_KEY_ALIAS}" 2>&1 | grep -oE 'SHA-?256:.*' | head -1 | sed -E 's/SHA-?256://;s/ //g')
            WHICH="maya-keystore(secret)"
          fi
          if [ -z "$FP" ] && [ -f "$HOME/.android/debug.keystore" ]; then
            FP=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>&1 | grep -oE 'SHA-?256:.*' | head -1 | sed -E 's/SHA-?256://;s/ //g')
            WHICH="debug-keystore(cache)"
          fi
          echo "::notice::SIGNATURE-DIAG which=$WHICH fp=${FP:-NONE} kt=$(command -v keytool || echo MISSING) android_dir=$(ls $HOME/.android 2>&1 | tr '\n' '|' | cut -c1-120) secret_file=${MAYA_KEYSTORE_FILE:-unset}"
          if [ -s "$PIN" ]; then
            PIN_FP=$(tr -d ' \n\r' < "$PIN")
            if [ -z "$FP" ] || [ "$FP" != "$PIN_FP" ]; then
              echo "::error::SIGNATURE BADAL GAYA! pinned=$PIN_FP mojooda=${FP:-none} — release NAHI banega (user ki settings udd jati hain). Jaan-boojh kar badalna ho to docs/signing-cert-sha256.txt update karo."
              exit 1
            fi
            echo "✅ Signature LOCKED — pinned ke sath match"
          else
            echo "::notice::BOOTSTRAP — signature capture: ${FP:-EMPTY} — docs/signing-cert-sha256.txt mein pin karo."
          fi

      - name: 7. Release banayo + APK upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "MAYA-$TAG.apk"
          gh release create "$TAG" "MAYA-$TAG.apk" \
            --title "MAYA $TAG" \
            --notes "Auto-release — npm test green hone ke baad bani APK. Install: phone par APK kholo → Install anyway."
          echo "✅ Release $TAG live"
