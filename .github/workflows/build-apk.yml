name: Build MAYA APK

# Har push par: PEHLE test, phir APK, phir "latest" RELEASE mein seedha download link
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Code checkout
        uses: actions/checkout@v4

      - name: 2. Node setup
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Deps install
        run: npm install --no-audit --no-fund

      - name: 4. TESTS (1000+ — ek bhi fail = build band)
        run: npm test

      - name: 5. BUILD SYNC CHECK (web/ se index.html fresh?)
        run: node build.js --check

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 1. Code checkout
        uses: actions/checkout@v4

      - name: 2. Java 17 setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3. Gradle 8.7 setup
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 3.5 STABLE DEBUG KEYSTORE (update-safe signature)
        # Android har naye runner par NAYA debug keystore bana deta tha —
        # isliye har APK ka signature alag tha, update ki jagah UNINSTALL
        # karna parta tha aur user ki saari SETTINGS udd jati thin (2026-10-19).
        # Ab wohi keystore cache se wapas aata hai → sab future APKs EK hi key
        # se sign → seedha UPDATE install, settings safe. (v5.10.2 se onward.)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: maya-debug-keystore-v2

      - name: 3.55 DEBUG KEYSTORE ensure (cache khali/kharaab ho to khud banao)
        # AGP ke bharose nahi — keytool se seedha standard jagah par banao,
        # phir AGP use hi karega. Cache POST ise bacha lega agli runs ke liye.
        # v5.10.2 hotfix: cache se file AAYE magar KHARAAB ho (service incident)
        # to AGP chup-chaap dusri key bana deta tha — ab VALIDATE kar ke
        # regenerate karo + loud notice. Gate (6.5) pin se match karayega.
        run: |
          mkdir -p "$HOME/.android"
          KS="$HOME/.android/debug.keystore"
          VALID=0
          if [ -f "$KS" ] && keytool -list -keystore "$KS" -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            VALID=1
          fi
          if [ "$VALID" = "1" ]; then
            echo "::notice::Debug keystore cache se mila + VALID — signature stable."
          else
            if [ -f "$KS" ]; then
              echo "::warning::Cache se keystore mila MAGAR KHARAAB tha — regenerate kar raha hoon (SIGNATURE LOCK gate pin se match karayega)."
              rm -f "$KS"
            else
              echo "::notice::Cache khali thi — naya debug keystore bana raha hoon."
            fi
            keytool -genkeypair -v -keystore "$KS" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug, O=Android, C=US" >/dev/null 2>&1
            echo "::notice::Naya debug keystore tayyar — is run ka signature gate batayega."
          fi

      - name: 4. Signing keystore (Secrets se — docs/SECURITY.md)
        env:
          MAYA_KEYSTORE_BASE64: ${{ secrets.MAYA_KEYSTORE_BASE64 }}
          MAYA_KEYSTORE_PASSWORD: ${{ secrets.MAYA_KEYSTORE_PASSWORD }}
          MAYA_KEY_ALIAS: ${{ secrets.MAYA_KEY_ALIAS }}
          MAYA_KEY_PASSWORD: ${{ secrets.MAYA_KEY_PASSWORD }}
        run: |
          if [ -n "$MAYA_KEYSTORE_BASE64" ]; then
            echo "$MAYA_KEYSTORE_BASE64" | base64 -d > app/maya.keystore
            echo "MAYA_KEYSTORE_FILE=app/maya.keystore" >> $GITHUB_ENV
            echo "MAYA_KEYSTORE_PASSWORD=$MAYA_KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "MAYA_KEY_ALIAS=$MAYA_KEY_ALIAS" >> $GITHUB_ENV
            echo "MAYA_KEY_PASSWORD=$MAYA_KEY_PASSWORD" >> $GITHUB_ENV
            echo "✅ Keystore ready (may signing)"
          else
            echo "⚠️ MAYA_KEYSTORE_BASE64 secret nahi — debug signing se build hoga (docs/SECURITY.md)"
          fi

      - name: 5. APK BUILD (3-6 minute)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 6. APK upload (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: MAYA-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 6.5 SIGNATURE LOCK (kabhi khamoshi se na badle)
        # GROUND TRUTH: APK ke ASLI signing certificate se fingerprint (apksigner).
        # Pin (docs/signing-cert-sha256.txt) se match na ho to APK release par
        # NAHI jayega — user ki settings kabhi khamoshi se nahi udeingi.
        run: |
          PIN="docs/signing-cert-sha256.txt"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          FP=""
          APS=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -f "$APK" ] && [ -n "$APS" ]; then
            FP=$("$APS" verify --print-certs "$APK" 2>/dev/null | grep -m1 'SHA-256 digest' | sed 's/.*: //' | tr -d ' :' | tr 'A-F' 'a-f')
          fi
          if [ -z "$FP" ] && [ -f "$APK" ]; then
            FP=$(keytool -printcert -jarfile "$APK" 2>&1 | grep -oE 'SHA-?256:.*' | head -1 | sed -E 's/SHA-?256://;s/ //g' | tr -d ':' | tr 'A-F' 'a-f')
          fi
          echo "::notice::SIGNATURE-DIAG apk_size=$(wc -c < "$APK" 2>/dev/null || echo 0) fp=${FP:-NONE} aps=$(basename ${APS:-none}) android_dir=$(ls $HOME/.android 2>&1 | tr '\n' '|' | cut -c1-120)"
          if [ -s "$PIN" ]; then
            PIN_FP=$(tr -d ' \n\r:' < "$PIN" | tr 'A-F' 'a-f')
            if [ -z "$FP" ] || [ "$FP" != "$PIN_FP" ]; then
              echo "::error::SIGNATURE BADAL GAYA! pinned=$PIN_FP mojooda=${FP:-none} — APK release par NAHI jayega (warna user ki settings udd jati hain). Agar yeh jaan-boojh kar hai to docs/signing-cert-sha256.txt update kar ke dobara chalao."
              exit 1
            fi
            echo "✅ Signature LOCKED — pinned ke sath match"
          else
            # BOOTSTRAP: pin nahi — is run ke signature ko khud commit karo
            # (GITHUB_TOKEN push recursion nahi banata + [skip ci] double-lock).
            if echo "$FP" | grep -qE '^[0-9a-f]{64}$'; then
              echo "$FP" > "$PIN"
              git config user.name "maya-ci"
              git config user.email "maya-ci@users.noreply.github.com"
              git add "$PIN"
              git commit -m "chore: signature pin bootstrap ${FP:0:12} [skip ci]"
              git push origin "HEAD:${GITHUB_REF_NAME}"
              echo "::notice::BOOTSTRAP — pin khud commit ho gaya: $FP (is run ka APK wahi key hai)"
            else
              echo "::error::Fingerprint hi nahi mila (fp=${FP:-empty}) — pin nahi lag sakta"
              exit 1
            fi
          fi

      - name: 6.6 AAB BUILD (Play Store) + same-signature check
        # v5.13.0 (WAQT 4-B): Play Console ko AAB chahiye. Upload key = wahi
        # pin key (6027458d) — APK aur AAB ka certificate EK hona lazmi hai,
        # warna Play "different signature" reject karta hai.
        run: |
          gradle bundleRelease --no-daemon --stacktrace
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          PIN="docs/signing-cert-sha256.txt"
          AFP=$(keytool -printcert -jarfile "$AAB" 2>&1 | grep -oE 'SHA-?256:.*' | head -1 | sed -E 's/SHA-?256://;s/ //g' | tr -d ':' | tr 'A-F' 'a-f')
          if [ -z "$AFP" ]; then
            RSA=$(unzip -Z1 "$AAB" | grep -E '^META-INF/.*\.(RSA|DSA|EC)$' | head -1)
            unzip -p "$AAB" "$RSA" > /tmp/aab.rsa
            AFP=$(keytool -printcert -file /tmp/aab.rsa 2>&1 | grep -oE 'SHA-?256:.*' | head -1 | sed -E 's/SHA-?256://;s/ //g' | tr -d ':' | tr 'A-F' 'a-f')
          fi
          echo "::notice::AAB-DIAG aab_size=$(wc -c < "$AAB" 2>/dev/null || echo 0) fp=${AFP:-NONE}"
          PIN_FP=$(tr -d ' \n\r:' < "$PIN" | tr 'A-F' 'a-f')
          if [ -z "$AFP" ] || [ "$AFP" != "$PIN_FP" ]; then
            echo "::error::AAB ka signature APK/pin se alag hai (${AFP:-none} vs $PIN_FP) — Play upload key mismatch!"
            exit 1
          fi
          echo "✅ AAB signed with PIN key — Play upload ke liye ready"

      - name: 7. 🌐 LATEST RELEASE — hamesha taaza download link
        # APK: /releases/download/latest/MAYA-latest.apk (phone updates)
        # AAB: /releases/download/latest/MAYA-latest.aab (Play Console upload)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MAYA-latest.apk
          cp app/build/outputs/bundle/release/*.aab MAYA-latest.aab
          VER=$(node -p "require('./package.json').version")
          NOTES="version: $VER · Auto-build ${GITHUB_SHA::7} · $(date -u +'%Y-%m-%d %H:%M UTC') · Tests green · Download: MAYA-latest.apk (phone) / MAYA-latest.aab (Play Console)"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest MAYA-latest.apk MAYA-latest.aab --clobber
            gh release edit latest --notes "$NOTES" --title "MAYA v$VER"
            echo "✅ 'latest' release asset replace — APK + AAB"
          else
            gh release create latest MAYA-latest.apk MAYA-latest.aab \
              --prerelease \
              --title "MAYA — Latest Build (auto)" \
              --notes "$NOTES"
            echo "✅ 'latest' release bana — APK + AAB"
          fi
